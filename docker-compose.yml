# Start:  docker compose up -d --build
# Werte wie AUTH_SECRET und CRON_SECRET werden aus der Datei .env im Projektordner gelesen.
name: campusbudget

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-campusbudget}:${POSTGRES_PASSWORD:-campusbudget}@db:5432/${POSTGRES_DB:-campusbudget}?schema=public
  APP_URL: ${APP_URL:-http://localhost:3000}
  AUTH_URL: ${APP_URL:-http://localhost:3000}
  AUTH_TRUST_HOST: "true"
  AUTH_SECRET: ${AUTH_SECRET:?Bitte AUTH_SECRET in .env setzen}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
  AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-CampusBudget <noreply@example.com>}
  # Im Container zeigt "localhost" auf den Container selbst → für Mailpit DOCKER_SMTP_HOST=mailpit
  SMTP_HOST: ${DOCKER_SMTP_HOST:-${SMTP_HOST:-}}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  CRON_SECRET: ${CRON_SECRET:?Bitte CRON_SECRET in .env setzen}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  UPLOAD_DIR: /app/uploads
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusbudget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusbudget}
      POSTGRES_DB: ${POSTGRES_DB:-campusbudget}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Nur lokal erreichbar (für `npm run dev`), nicht aus dem Netzwerk
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lokales Test-Postfach: fängt alle E-Mails ab (Ansicht: http://localhost:8025, SMTP: localhost:1025)
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  # Einmaliger Job: Migrationen anwenden (+ Demo-Daten, wenn SEED_DEMO=true)
  migrate:
    build:
      context: .
      target: migrator
    environment:
      <<: *app-env
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        APP_URL: ${APP_URL:-http://localhost:3000}
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Täglicher Cron-Job: wiederkehrende Zahlungen buchen, Erinnerungen senden, aufräumen
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?Bitte CRON_SECRET in .env setzen}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 5 * * *}
      TZ: Europe/Berlin
    volumes:
      - ./docker/cron/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
